<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Roomsmith Studio</title>
<link rel="stylesheet" href="/app.css">
<script src="/app.js" defer></script>
</head>
<body>
<header>
  <strong>Roomsmith</strong>
  <span id="where" class="muted"></span>
  <nav>
    <button data-tab="photos" class="on">Photos</button>
    <button data-tab="revisions">Revisions</button>
    <button data-tab="catalog">Catalog</button>
  </nav>
</header>
<div id="layout">
  <aside id="tree" aria-label="Projects and rooms"></aside>
  <main>
    <section id="photos" class="tab on">
      <label id="drop">
        <input id="file" type="file" accept="image/jpeg,image/png,image/webp" multiple hidden>
        <span>Drop photos here, or click to choose. JPEG, PNG or WebP. Location data is removed on upload.</span>
      </label>
      <div id="grid"></div>
      <div id="annotator" hidden>
        <div class="toolbar">
          <button data-tool="line" class="on" title="Draw a line and enter its measured length">Measure</button>
          <button data-tool="point" title="Mark an opening or feature">Tag</button>
          <button data-tool="rect" title="Outline an area">Area</button>
          <button data-tool="arrow" title="Point at something">Arrow</button>
          <span class="spacer"></span>
          <span id="saved" class="muted"></span>
          <button id="save" class="primary">Save</button>
          <button id="close">Close</button>
        </div>
        <div class="annot-body">
          <div id="stage"><img id="photo" alt=""><canvas id="ink"></canvas></div>
          <div id="items"></div>
        </div>
      </div>
    </section>
    <section id="revisions" class="tab">
      <div id="revlist"></div>
      <h3>Flip between revisions</h3>
      <div class="flipbar">
        <label>A <select id="revA"></select></label>
        <label>B <select id="revB"></select></label>
        <label>Image <select id="flipfile"></select></label>
        <button id="flip" class="primary" title="Space bar also flips">Flip A / B</button>
      </div>
      <figure id="flipview"><img id="flipimg" alt=""><figcaption id="fliplabel"></figcaption></figure>
    </section>
    <section id="catalog" class="tab"><div id="cat"></div></section>
  </main>
</div>
<div id="toast" role="status"></div>
</body>
</html>
