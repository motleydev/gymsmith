# vulnix whitelist for `nix run .#cve-scan`.
#
# Empty on purpose. Add an entry only for a CVE that has been read and does not apply to how
# Roomsmith uses the package, and say why and until when — a whitelist with no reasons is a
# list of vulnerabilities nobody is looking at any more. Format:
#
#   ["chromium"]
#   cve = ["CVE-2026-00000"]
#   until = "2026-12-01"
#   comment = "Only reachable through WebUSB; Chromium runs headless on local, script-free pages"
